<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Crédito</title>
    <link rel="icon" href="static/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="static/styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1 class="text-center mb-4">✨ ¡Cuéntanos sobre ti!</h1>
            
            <div class="step-indicator">
                <div class="step active" data-step="1">1</div>
                <div class="step" data-step="2">2</div>
                <div class="step" data-step="3">3</div>
                <div class="step" data-step="4">4</div>
            </div>
            
            <div class="progress">
                <div class="progress-bar" role="progressbar" style="width: 25%" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            
            <form action="/predict" method="post" class="needs-validation" novalidate>
                <!-- Sección 1: Información Personal -->
                <div class="form-section active" data-step="1">
                    <div class="section">
                        <h3 class="h5 mb-3">Información Personal</h3>
                        <div class="mb-3">
                            <label class="form-label">Documento</label>
                            <input type="text" name="documento" class="form-control" required placeholder="Ingrese su número de documento">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">👤</span> ¿Cuántos años tienes?</label>
                            <input type="text" name="edad" class="form-control" placeholder="Ej: Tengo 35 años.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">📄</span> ¿Hace cuánto renovaste o actualizaste tu documento de identidad?</label>
                            <input type="text" name="doc_publish" class="form-control" placeholder="Ej: Lo renové hace 3 años.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">💼</span> ¿Hace cuánto tiempo trabajas en tu empleo actual?</label>
                            <input type="text" name="empleo" class="form-control" placeholder="Ej: Llevo 5 años trabajando en la misma empresa.">
                        </div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn-nav next-btn">Siguiente</button>
                    </div>
                </div>

                <!-- Sección 2: Información de Contacto y Financiera -->
                <div class="form-section" data-step="2">
                    <div class="section">
                        <h3 class="h5 mb-3">Información de Contacto y Financiera</h3>
                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">📱</span> ¿Hace cuánto cambiaste tu número de celular por última vez?</label>
                            <input type="text" name="celular" class="form-control" placeholder="Ej: Hace 8 meses cambié de número.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">📝</span> ¿Hace cuánto actualizaste por última vez tu información personal en una entidad oficial?</label>
                            <input type="text" name="registro" class="form-control" placeholder="Ej: Hace 6 años actualicé mi dirección en el banco.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">💰</span> ¿Cuál es tu ingreso mensual aproximado?</label>
                            <input type="text" name="ingresos" class="form-control" placeholder="Ej: Gano alrededor de 2 millones de pesos al mes.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">⏰</span> ¿A qué hora del día hiciste tu solicitud de crédito?</label>
                            <input type="text" name="hora" class="form-control" placeholder="Ej: La hice en la mañana, a las 10 am.">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn-nav prev-btn">Anterior</button>
                        <button type="button" class="btn-nav next-btn">Siguiente</button>
                    </div>
                </div>

                <!-- Sección 3: Información del Crédito -->
                <div class="form-section" data-step="3">
                    <div class="section">
                        <h3 class="h5 mb-3">Información del Crédito</h3>
                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">💵</span> ¿De cuánto dinero es el crédito que estás solicitando?</label>
                            <input type="text" name="credito" class="form-control" placeholder="Ej: Estoy solicitando 50 millones de pesos.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">🏷️</span> ¿Cuál es el valor del bien que planeas comprar con el crédito?</label>
                            <input type="text" name="precio" class="form-control" placeholder="Ej: El apartamento cuesta 200 millones de pesos.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">📊</span> ¿De cuánto sería la cuota aproximada que debes pagar por el crédito?</label>
                            <input type="text" name="anualidad" class="form-control" placeholder="Ej: La cuota sería de 800 mil pesos mensuales.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">🏠</span> ¿Cuál es aproximadamente el tamaño de tu vivienda (en metros cuadrados)?</label>
                            <input type="text" name="area" class="form-control" placeholder="Ej: Mi apartamento mide 70 metros cuadrados.">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn-nav prev-btn">Anterior</button>
                        <button type="button" class="btn-nav next-btn">Siguiente</button>
                    </div>
                </div>

                <!-- Sección 4: Información Adicional -->
                <div class="form-section" data-step="4">
                    <div class="section">
                        <h3 class="h5 mb-3">Información Adicional</h3>
                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">🏘️</span> ¿Vives en una zona muy poblada o en una zona poco habitada?</label>
                            <input type="text" name="region" class="form-control" placeholder="Ej: Vivo en un barrio muy poblado dentro de la ciudad.">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><span class="emoji-icon">📈</span> ¿Quieres que consultemos puntajes de riesgo de entidades externas para complementar tu perfil?</label>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small">Puntaje externo 2</label>
                                    <input type="text" name="ext2" class="form-control" placeholder="Ej: 0.8">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small">Puntaje externo 3</label>
                                    <input type="text" name="ext3" class="form-control" placeholder="Ej: 0.7">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <button type="button" class="btn-nav prev-btn">Anterior</button>
                        <button type="submit" class="btn-submit">Enviar Formulario</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Navegación entre secciones
        const sections = document.querySelectorAll('.form-section');
        const nextBtns = document.querySelectorAll('.next-btn');
        const prevBtns = document.querySelectorAll('.prev-btn');
        const steps = document.querySelectorAll('.step');
        const progressBar = document.querySelector('.progress-bar');
        let currentSection = 0;

        function updateProgress() {
            const progress = ((currentSection + 1) / sections.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressBar.setAttribute('aria-valuenow', progress);
            
            // Actualizar indicadores de pasos
            steps.forEach((step, idx) => {
                if (idx < currentSection + 1) {
                    step.classList.add('completed');
                } else {
                    step.classList.remove('completed');
                }
                if (idx === currentSection) {
                    step.classList.add('active');
                } else {
                    step.classList.remove('active');
                }
            });
        }

        function showSection(n) {
            sections.forEach(section => section.classList.remove('active'));
            sections[n].classList.add('active');
            currentSection = n;
            updateProgress();
        }

        nextBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (currentSection < sections.length - 1) {
                    showSection(currentSection + 1);
                }
            });
        });

        prevBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (currentSection > 0) {
                    showSection(currentSection - 1);
                }
            });
        });

        // Validación del formulario
        const form = document.querySelector('form');
        form.addEventListener('submit', event => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        });

        // Inicialización
        showSection(0);
    </script>
</body>
</html>
